spring:
  datasource:
    url: jdbc:h2:mem:agent
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    show-sql: true
    hibernate.ddl-auto: update
  h2.console:
    enabled: true
    path: /h2-console
    settings:
      trace: false
      web-allow-others: false

info:
  app:
    name: '@project.artifactId@'
    encoding: '@project.build.sourceEncoding@'
    java:
      version: '@java.version@'

logging:
  level:
    ru.a2n.sfm: DEBUG
