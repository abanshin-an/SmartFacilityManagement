server:
  port: 8080

spring:
  application:
    name: gateway-ms
  cloud:
    circuitbreaker:
      resilience4j:
        enabled: true
        instances:
          default:
            registerHealthIndicator: true
            slidingWindowType: COUNT_BASED
            slidingWindowSize: 10
            minimumNumberOfCalls: 5
            permittedNumberOfCallsInHalfOpenState: 3
            automaticTransitionFromOpenToHalfOpenEnabled: true
            waitDurationInOpenState: 10s
            failureRateThreshold: 50
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: person
              uri: http://person:8080
              predicates:
                - Path=/api/person/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10  # Количество запросов в секунду
                    redis-rate-limiter.burstCapacity: 20   # Максимальное количество запросов
                    redis-rate-limiter.requestedTokens: 1  # Количество токенов на запрос
                    key-resolver: "#{@remoteAddressKeyResolver}"
              metadata:
                metrics:
                  name: person.route
                  tags:
                    service: owner

            - id: person-api-docs
              uri: http://person:8080
              predicates:
                - Path=/person-api/v3/api-docs
              filters:
                - RewritePath=/person-api/v3/api-docs, /v3/api-docs
              metadata:
                metrics:
                  name: person.api.docs.route
                  tags:
                    type: documentation

            - id: facility
              uri: http://facility:8080
              predicates:
                - Path=/api/facility/**
              metadata:
                metrics:
                  name: facility.route
                  tags:
                    service: facility

            - id: facility-api-docs
              uri: http://facility:8080
              predicates:
                - Path=/facility-api/v3/api-docs
              filters:
                - RewritePath=/facility-api/v3/api-docs, /v3/api-docs
              metadata:
                metrics:
                  name: facility.api.docs.route
                  tags:
                    type: documentation

            - id: swagger-ui
              uri: http://person:8080
              predicates:
                - Path=/swagger-ui.html
              filters:
                - RewritePath=/swagger-ui.html, /swagger-ui/index.html
              metadata:
                metrics:
                  name: swagger.ui.route
                  tags:
                    type: documentation

            - id: swagger-resources
              uri: http://person:8080
              predicates:
                - Path=/swagger-resources/**
              metadata:
                metrics:
                  name: swagger.resources.route
                  tags:
                    type: documentation

            - id: appointment-api-docs
              uri: http://appointment:8080
              predicates:
                - Path=/appointment-api/v3/api-docs
              filters:
                - RewritePath=/appointment-api/v3/api-docs, /v3/api-docs
              metadata:
                metrics:
                  name: appointment.api.docs.route
                  tags:
                    type: documentation

          metrics:
            enabled: true
            tags:
              route:
                enabled: true
              uri:
                enabled: true
              status:
                enabled: true
              outcome:
                enabled: true
              exception:
                enabled: true
              http:
                method:
                  enabled: true
  data:
    redis:
      host: redis
      port: 6379
  main:
    allow-bean-definition-overriding: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
      base-path: /actuator
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  endpoint:
    gateway:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: TRACE
    io.micrometer: INFO
    org.springframework.boot.actuate.metrics: DEBUG